# DO NOT commit real secrets to git in a real project.
# For this local demo it's fine, but call this out on camera as a simplification.
# Generate this properly instead with:
#   kubectl create secret generic backend-secret \
#     --namespace devops-challenge \
#     --from-literal=DB_PASSWORD=apppass
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: devops
type: Opaque
stringData:
  DB_PASSWORD: "apppass"
