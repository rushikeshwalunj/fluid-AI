name: Build and Deploy

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/devops-challenge-backend

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=${{ env.IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: |
            ${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build
    # IMPORTANT: this job needs network access to your cluster's API server.
    # - For a LOCAL cluster (minikube/kind/k3s), use a self-hosted runner on
    #   the same machine as the cluster (Settings > Actions > Runners > New
    #   self-hosted runner), then set: runs-on: self-hosted
    # - For a cloud cluster (EKS/GKE/AKS), keep ubuntu-latest and add the
    #   matching cloud-auth action (aws-actions/configure-aws-credentials,
    #   google-github-actions/auth, azure/login) before the kubectl step.
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Set kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config

      - name: Apply manifests
        run: kubectl apply -f k8s/

      - name: Roll out new image
        run: |
          kubectl set image deployment/backend backend=${{ needs.build.outputs.image_tag }} \
            -n devops-challenge
          kubectl rollout status deployment/backend -n devops-challenge --timeout=120s
