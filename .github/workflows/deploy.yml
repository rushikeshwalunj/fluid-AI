name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    # This runner IS your EC2 box running Minikube — that's what lets this
    # reach the cluster directly with no registry, no cloud auth, no
    # exposed API server. See README for why self-hosted is required here.
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Set kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config

      - name: Build image directly into Minikube
        run: |
          minikube image build -t devops-challenge-backend:${{ github.sha }} ./app
          minikube image build -t devops-challenge-backend:latest ./app

      - name: Apply manifests
        run: kubectl apply -f k8s/

      - name: Roll out new image
        run: |
          kubectl set image deployment/backend backend=devops-challenge-backend:${{ github.sha }} \
            -n devops-challenge
          kubectl rollout status deployment/backend -n devops-challenge --timeout=120s

      - name: Show final state
        if: always()
        run: |
          kubectl get pods -n devops-challenge
          kubectl get svc backend -n devops-challenge
